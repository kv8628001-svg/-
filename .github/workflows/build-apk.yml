name: Build Real Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Initialize Wrapper and Permissions
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    - name: Run Automated Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

    - name: Build Clean Release and Debug APK
      run: ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon

    - name: Verify Official Release APK Signature
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
        echo "Using apksigner: $APKSIGNER"
        $APKSIGNER verify --verbose --print-certs $APK_PATH

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SceneBot-app-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
