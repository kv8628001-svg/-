name: Build Real Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Initialize Wrapper and Permissions
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    - name: Run Automated Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Ensure Dual v1 and v2 Signature
      run: |
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        keytool -genkeypair -v -keystore scenebot.keystore -alias scenebot -keyalg RSA -keysize 2048 -validity 10000 -storepass scenebot123 -keypass scenebot123 -dname "CN=SceneBot, OU=Android, O=SceneBot, L=Dhaka, S=Dhaka, C=BD"
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
        echo "Using apksigner: $APKSIGNER"
        $APKSIGNER sign --ks scenebot.keystore --ks-pass pass:scenebot123 --ks-key-alias scenebot --key-pass pass:scenebot123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out app/build/outputs/apk/debug/app-debug.apk $APK_PATH
        $APKSIGNER verify --verbose app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SceneBot-app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
